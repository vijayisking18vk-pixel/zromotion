name: Monthly Rent Data Refresh & SEO Rebuild

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Refresh Rental Data from Supabase
        run: node scripts/refresh-rent-data.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Rebuild Sitemaps & Static Site
        run: npm run build

      - name: Run SEO Automated Test Suite
        run: npm run test:seo

      - name: Commit & Push if Data Changed
        run: |
          git config --local user.email "bot@chennairents.in"
          git config --local user.name "Chennai Rents Automation Bot"
          git add src/data/rentData.js public/sitemap*.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated monthly rent data refresh [skip ci]" && git push)
