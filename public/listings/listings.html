<style>
:root{
  color-scheme:light;
  --bg:#FAF6EE;
  --card:#FFFDF9;
  --ink:#1F1A17;
  --mute:#6B6159;
  --sand:#E9DFC9;
  --red:#B5372B;
  --redt:#F6E3DF;
  --yel:#D9A21B;
  --yelt:#F4E7C2;
  --blue:#1F5F8B;
  --bluet:#E3EDF4;
  --grn:#2E7D4F;
  --grnt:#E1F0E6;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 16px/1.5 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;
  border-top:3px solid #4A2C1F;
  padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
  position:relative;
  overflow-x:hidden;
  min-height:100vh;
}
.page{max-width:1240px;margin:0 auto;padding:20px 20px 32px;display:grid;gap:20px;grid-template-columns:1fr;position:relative;z-index:1}
@media(min-width:900px){.page{grid-template-columns:340px 1fr;gap:36px;padding:32px 24px 40px}.side{position:sticky;top:16px;align-self:start}}
.bar{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-logo-img{height:38px;width:auto;border-radius:4px;mix-blend-mode:multiply;display:block}
.brand-txt{display:flex;align-items:baseline;line-height:1}
.brand-txt b{font-size:20px;font-weight:700;color:var(--ink)}
.brand-txt b.red{color:var(--red);font-weight:800}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bar-link{font-size:14px;font-weight:600;color:var(--mute);text-decoration:none;padding:6px 10px;border-radius:8px;transition:background 0.15s ease}
.bar-link:hover{background:var(--sand)}
.bar em{font-style:normal;font-size:14px;color:var(--grn);font-weight:600;background:var(--grnt);padding:4px 10px;border-radius:12px}

.post{border:1.5px dashed var(--sand);border-radius:24px;background:#F6F1E7;padding:22px;position:relative;overflow:hidden}
.post .art{display:block;width:100%;height:70px;margin:0 0 14px;color:var(--ink)}
.post h2,.filters h2{margin:0 0 8px;font-size:19px;font-weight:600}
.post p{margin:0 0 18px;color:var(--mute);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;width:100%;border:0;border-radius:30px;background:var(--red);color:#fff;font:600 17px Outfit,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 6px 14px rgba(181,55,43,.22);transition:background 0.15s ease,transform 0.1s ease}
.btn:hover{background:#9e2f24;transform:translateY(-1px)}

.ftoggle{display:flex;justify-content:space-between;align-items:center;min-height:52px;width:100%;margin-top:0;padding:0 20px;border:1px solid var(--sand);border-radius:16px;background:var(--card);font:600 16px Outfit,sans-serif;color:var(--ink);cursor:pointer}
.ftoggle span{background:var(--red);color:#fff;border-radius:12px;padding:0 9px;font-size:13px;min-width:24px;text-align:center;line-height:22px}
.filters{display:none;margin-top:0;border:1px solid var(--sand);border-radius:24px;background:var(--card);padding:22px}
.filters.open{display:block}
@media(min-width:900px){.ftoggle{display:none}.filters{display:block;margin-top:0}}

.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fh h2{margin:0;font-size:20px}
.clr{background:none;border:0;color:var(--red);font:500 15px Outfit,sans-serif;cursor:pointer;min-height:44px}
.clr:hover{text-decoration:underline}
.lab{display:block;margin:18px 0 8px;font-size:14px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--sand);border-radius:12px;background:var(--card);font:600 15px Outfit,sans-serif;color:var(--ink);cursor:pointer;transition:all 0.15s ease}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.chip svg{width:18px;height:18px}
input,select{width:100%;min-height:50px;padding:0 16px;border:1px solid var(--sand);border-radius:14px;background:var(--card);color:var(--ink);font:16px Outfit,sans-serif}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

h1{margin:0 0 6px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
@media(min-width:700px){h1{font-size:38px}}
.sub{margin:0 0 20px;color:var(--mute);font-size:16px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border:1px solid var(--sand);border-radius:26px;background:var(--card);font:600 16px Outfit,sans-serif;color:var(--ink);cursor:pointer;transition:all 0.15s ease}
.tab:hover{border-color:var(--ink)}
.tab svg{width:20px;height:20px;color:var(--red)}
.tab b{background:var(--yelt);border-radius:12px;min-width:26px;padding:0 8px;font-size:13px;line-height:24px;text-align:center;color:var(--ink)}
.tab[aria-selected=true]{background:#1F1A17;border-color:#1F1A17;color:#fff}
.tab[aria-selected=true] svg{color:#fff}
.tab[aria-selected=true] b{background:#4A4440;color:#fff}

.kol{display:block;width:100%;max-width:300px;height:24px;margin:4px 0 22px;color:var(--yel)}
.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{border:1px solid var(--sand);border-radius:20px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.2s ease,transform 0.2s ease}
.card:hover{border-color:var(--mute);transform:translateY(-2px)}
.pic{position:relative;height:150px;background:var(--bluet)!important;border-bottom:1px solid var(--sand);color:var(--ink);overflow:hidden}
.pic svg.sc{position:absolute;inset:0;width:100%;height:100%}
.pic .tag{position:absolute;left:12px;top:12px;background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:3px 12px;border-radius:12px;z-index:2}
.pic .ver{position:absolute;right:12px;top:12px;background:var(--grnt);color:var(--grn);font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;z-index:2;display:inline-flex;align-items:center;gap:4px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.loc{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px;margin-top:-4px}
.loc svg{width:16px;height:16px;flex:none;color:var(--red)}
.price{font-size:24px;font-weight:700;color:var(--red)}
.price small{font-size:14px;font-weight:500;color:var(--mute)}

.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta span{background:#F6F1E7;border:1px solid var(--sand);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;line-height:1.3}

.req{margin-top:auto;min-height:48px;border:1.5px solid var(--red);border-radius:14px;background:transparent;color:var(--red);font:600 15px Outfit,sans-serif;cursor:pointer;transition:all 0.15s ease}
.req:hover{background:var(--red);color:#fff}
.req[disabled]{background:var(--grnt);border-color:var(--grn);color:var(--grn);cursor:default}

.empty{border:1.5px dashed var(--sand);border-radius:20px;padding:40px 20px;text-align:center;color:var(--mute);background:var(--card)}
.empty svg{width:90px;height:64px;margin:0 auto 6px;display:block}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty button{margin-top:14px;min-height:48px;padding:0 22px;border-radius:24px;border:1px solid var(--red);background:var(--red);color:#fff;font:600 15px Outfit,sans-serif;cursor:pointer}

.skyline{position:relative;width:100%;max-width:1024px;margin:32px auto 0;pointer-events:none;z-index:0;display:flex;justify-content:center;align-items:center;padding:0 16px}
.skyline-img{width:100%;max-width:1024px;height:auto;display:block;margin:0 auto}
.foot{text-align:center;font-size:14px;color:var(--mute);z-index:1;margin:12px 0 28px}
.drive{position:relative;margin:0 auto;display:block;width:46px;animation:roll 22s linear infinite}
@keyframes roll{from{left:-60px}to{left:100%}}
@media(prefers-reduced-motion:reduce){.drive{animation:none;left:20px}.card,.btn,.tab{transition:none}}
</style>
</head>

<script>
// Sample listings for preview. Replace with your real data source.
const L = [
  {id:1,type:"rent",bhk:2,area:"Adyar",land:"Near Adyar signal",price:32000,dep:"3 months",furn:"Semi-furnished",fl:"2nd of 4",sq:1050,face:"East",ten:"Family",water:"Metro water",park:"Bike and car"},
  {id:2,type:"rent",bhk:1,area:"Velachery",land:"5 min from Velachery MRTS",price:16500,dep:"2 months",furn:"Unfurnished",fl:"1st of 3",sq:580,face:"North",ten:"Bachelors",water:"Both",park:"Bike"},
  {id:3,type:"rent",bhk:3,area:"Anna Nagar",land:"Near Anna Nagar Tower",price:48000,dep:"6 months",furn:"Fully furnished",fl:"5th of 8",sq:1600,face:"West",ten:"Family, company lease",water:"Metro water",park:"Bike and car"},
  {id:4,type:"sale",bhk:3,area:"Thiruvanmiyur",land:"Walkable to Beach Road",price:13500000,dep:"",furn:"Ready to Move",fl:"3rd of 5",sq:1680,face:"North-East",ten:"Freehold Title",water:"Metro water",park:"2 Covered Cars"},
  {id:5,type:"sale",bhk:2,area:"OMR",land:"Near Sholinganallur Junction",price:6800000,dep:"",furn:"Semi-furnished",fl:"6th of 14",sq:1120,face:"East",ten:"Clear Deed",water:"Both",park:"1 Covered Car"}
];

const AREAS = [
  "Adyar","Alwarpet","Ambattur","Anna Nagar","Besant Nagar","Chromepet",
  "ECR","Guindy","Kilpauk","Kodambakkam","Madipakkam","Medavakkam",
  "Mogappair","Mylapore","Navalur","Nungambakkam","OMR","Pallavaram",
  "Perambur","Perungudi","Porur","Royapettah","Sholinganallur","T. Nagar",
  "Tambaram","Thiruvanmiyur","Thoraipakkam","Velachery","Villivakkam"
];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const F = {mode:"all",area:"",bhk:"all",rent:"",sale:""};

const inr = n => {
  n = String(n);
  return n.length <= 3 ? n : n.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,",") + "," + n.slice(-3);
};

$("#fa").insertAdjacentHTML("beforeend", AREAS.map(a => `<option value="${a}">${a}</option>`).join(""));
const asked = new Set();

function match(x) {
  if (F.mode != "all" && x.type != F.mode) return false;
  if (F.area && x.area != F.area) return false;
  if (F.bhk != "all" && (F.bhk == "4" ? x.bhk < 4 : x.bhk != +F.bhk)) return false;
  if (x.type == "rent" && F.rent && x.price > +F.rent) return false;
  if (x.type == "sale" && F.sale && x.price > +F.sale * 100000) return false;
  return true;
}

const SUN = '<circle cx="335" cy="36" r="16" fill="#D9A21B"/>';
const TREE = (x,y) => `<rect x="${x-4}" y="${y}" width="8" height="40" fill="#6B4A2F"/><circle cx="${x}" cy="${y-8}" r="26" fill="#2E7D4F"/><circle cx="${x-20}" cy="${y+6}" r="17" fill="#2E7D4F"/><circle cx="${x+20}" cy="${y+6}" r="17" fill="#2E7D4F"/>`;
const WAVE = '<path d="M0 134q25-8 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0v16H0z" fill="#1F5F8B" opacity=".4"/>';
const G = '<path d="M0 148h400" stroke="#1F1A17" stroke-width="2"/>';

function scene(i) {
  const k = i % 3;
  if (k == 1) {
    return SUN + WAVE + '<rect x="50" y="86" width="84" height="48" fill="#FFFDF9" stroke="#1F1A17" stroke-width="2"/><path d="M42 86l50-32 50 32z" fill="#B5372B" stroke="#1F1A17" stroke-width="2"/><rect x="82" y="106" width="20" height="28" fill="#D9A21B" stroke="#1F1A17" stroke-width="2"/>' + TREE(240,84) + G;
  }
  if (k == 2) {
    return SUN + '<rect x="40" y="96" width="320" height="22" rx="4" fill="#B5372B" stroke="#1F1A17" stroke-width="2"/><path d="M40 108h320" stroke="#D9A21B" stroke-width="4"/><path d="M0 128h400" stroke="#1F1A17" stroke-width="3"/><path d="M60 96V84M140 96V84M220 96V84M300 96V84M40 84h340" stroke="#1F1A17" stroke-width="2"/>' + TREE(80,60) + G;
  }
  return SUN + '<rect x="150" y="30" width="70" height="104" fill="#FFFDF9" stroke="#1F1A17" stroke-width="2"/><path d="M164 50h12M194 50h12M164 74h12M194 74h12M164 98h12M194 98h12" stroke="#B5372B" stroke-width="5"/><rect x="22" y="70" width="90" height="64" fill="#F4E7C2" stroke="#1F1A17" stroke-width="2"/>' + TREE(300,84) + G;
}

function card(x) {
  const sale = x.type == "sale";
  return `
    <article class="card">
      <div class="pic">
        <svg class="sc" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${scene(x.id)}</svg>
        <span class="tag">${sale ? "For sale" : "For rent"}</span>
        <span class="ver">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Verified owner
        </span>
      </div>
      <div class="body">
        <h3>${x.bhk} BHK in ${x.area}</h3>
        <div class="loc"><svg><use href="#i-pin"/></svg>${x.land}</div>
        <div class="price">₹${inr(x.price)}${sale ? "" : " <small>/month</small>"}</div>
        <div class="meta">
          <span>${x.furn}</span>
          <span>${x.sq} sq ft</span>
          <span>${x.fl} floor</span>
          <span>${x.face} facing</span>
          ${sale ? "" : `<span>Deposit ${x.dep}</span>`}
          <span>${x.water}</span>
          <span>Parking: ${x.park}</span>
          <span>${x.ten}</span>
        </div>
        <button type="button" class="req" data-id="${x.id}" ${asked.has(x.id) ? "disabled" : ""}>
          ${asked.has(x.id) ? "Requested. Owner will reply soon" : "Request owner's number"}
        </button>
      </div>
    </article>
  `;
}

function render() {
  const c = t => L.filter(x => t == "all" || x.type == t).length;
  $("#tabs").innerHTML = [
    ["all","All listings","i-list"],
    ["rent","For rent","i-home"],
    ["sale","For sale (buy)","i-tag"]
  ].map(([k,n,i]) => `
    <button class="tab" role="tab" data-v="${k}" aria-selected="${F.mode == k}">
      <svg><use href="#${i}"/></svg>${n}<b>${c(k)}</b>
    </button>
  `).join("");

  const r = L.filter(match);
  $("#out").innerHTML = r.length
    ? `<div class="grid">${r.map(card).join("")}</div>`
    : `
      <div class="empty">
        <svg viewBox="0 0 40 28" aria-hidden="true"><use href="#auto"/></svg>
        <b>No homes match yet</b>
        ${F.mode == "sale" && !L.some(x => x.type == "sale")
          ? "No sale listings right now. Check back soon, or list yours."
          : "Try a higher budget or a different area."
        }
        <br>
        <button type="button" id="reset">Clear filters</button>
      </div>
    `;

  $$("#fm .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.v == F.mode));
  $$("#fb .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.v == F.bhk));

  const n = (F.mode != "all") + (!!F.area) + (F.bhk != "all") + (!!F.rent) + (!!F.sale);
  $("#fc").textContent = n;
}

$("#tabs").onclick = e => {
  const b = e.target.closest(".tab");
  if (b) { F.mode = b.dataset.v; render(); }
};

$("#fm").onclick = e => {
  const b = e.target.closest(".chip");
  if (b) { F.mode = b.dataset.v; render(); }
};

$("#fb").onclick = e => {
  const b = e.target.closest(".chip");
  if (b) { F.bhk = b.dataset.v; render(); }
};

$("#fa").onchange = e => {
  F.area = e.target.value;
  render();
};

$("#fr").oninput = e => {
  F.rent = e.target.value = e.target.value.replace(/\D/g, "");
  render();
};

$("#fs").oninput = e => {
  F.sale = e.target.value = e.target.value.replace(/\D/g, "");
  render();
};

function reset() {
  Object.assign(F, {mode:"all", area:"", bhk:"all", rent:"", sale:""});
  $("#fa").value = "";
  $("#fr").value = "";
  $("#fs").value = "";
  render();
}

$("#clr").onclick = reset;

$("#out").onclick = e => {
  if (e.target.id == "reset") return reset();
  const b = e.target.closest(".req");
  if (b && !b.disabled) {
    asked.add(+b.dataset.id);
    render();
  }
};

$("#ft").onclick = () => {
  const o = $("#fl").classList.toggle("open");
  $("#ft").setAttribute("aria-expanded", o);
};

// Initial render
render();
</script>
</body>
</html>
