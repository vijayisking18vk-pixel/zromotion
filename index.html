<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var d = document.documentElement;
        var w = d.clientWidth || window.innerWidth;
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        d.style.setProperty("--px-vw", w * 0.01 + "px");
        d.style.setProperty("--px-svh", h * 0.01 + "px");
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        if (path === "/" || path === "/index" || path === "/index.html") {
          d.classList.add("site-preloader-pending");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2340" />
    <title>ChennaiRents — Homes Worth Renting. Chennai, Elevated.</title>
    <meta name="description" content="ChennaiRents is a boutique rental-property agency curating Chennai's best long-term rental homes. Premium, editorial, visual-first — ECR Coastal, Green Belt, City Central & Signature Homes." />
    <meta name="keywords" content="Chennai rental homes, ECR apartments, OMR flats, Mylapore rentals, Nungambakkam apartments, boutique rental agency Chennai, long-term rental Chennai" />
    <meta name="author" content="ChennaiRents" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://chennairents.in/" />

    <!-- OG / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="ChennaiRents" />
    <meta property="og:title" content="ChennaiRents — Homes Worth Renting." />
    <meta property="og:description" content="Boutique rental-property agency curating Chennai's finest long-term homes." />
    <meta property="og:url" content="https://chennairents.in/" />

    <!-- Preloader critical styles -->
    <style>
      html.site-preloader-pending,
      html.site-preloader-pending body {
        background: #1B2340;
        overflow: hidden;
      }
      #site-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1B2340;
        color: #F7F5F1;
        pointer-events: none;
      }
      html:not(.site-preloader-pending) #site-preloader {
        display: none;
      }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Preloader -->
    <div id="site-preloader">
      <div id="preloader-counter" style="font-family:'The Seasons','Cormorant Garamond','Playfair Display',serif;font-size:clamp(4.5rem,13vw,10rem);font-weight:400;letter-spacing:-0.04em;color:#F7F5F1;line-height:1;">00</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
