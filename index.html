  <!-- Global SVG Filters for Liquid Morphing Effect -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">

      <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
